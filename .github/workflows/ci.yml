name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Unit tests cover the OpenCV / overlay code, so CI skips the large PyTorch install.
      - name: Install test dependencies
        run: pip install "opencv-python-headless>=4.8,<5" "numpy>=1.26" pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

[project]
name = "visionlab-ai"
version = "1.0.0"
description = "Real-time object detection and pose estimation from your browser webcam, built with Streamlit, WebRTC and Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
